version: 1

# Service diagnostics, page 1: telemetry and navigation.
#
# Select `services` as the widget's Layout to load this screen on any model.
# Page 2 is `services2`.
#
# Each panel prints one shared service's normalized output as plain rows, so a
# wrong unit, a missing precision, a stale classification, or a bearing taken
# from the wrong end is visible before any panel depends on it. Change the
# source names below to sensors your model actually has.

grid:
  columns: 4
  rows: 4

panels:
  - id: telemetry
    type: service-probe
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 4
    config:
      service: telemetry
      label: Telemetry
      source: RxBt
      accent: cyan
  - id: navigation
    type: service-probe
    col: 2
    row: 0
    colSpan: 2
    rowSpan: 4
    config:
      service: navigation
      label: Navigation
      source: GPS
      accent: green
