version: 2

# Service diagnostics, page 2: model and control.
#
# Select `services2` as the widget's Layout to load this screen on any
# model.
#
# `index` selects the model timer for the model service and the global
# variable for the control service.

grid:
  columns: 4
  rows: 4

panels:
  - id: model
    type: service-probe
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      service: model
      label: Model
      index: 0
      accent: amber
  - id: control
    type: service-probe
    col: 0
    row: 2
    colSpan: 2
    rowSpan: 2
    config:
      service: control
      label: Control
      source: trim-ail
      index: 0
      accent: orange
