# Theme schema version. Increment only when the theme file format changes.
version: 1
# Theme identifier; must match this file's name without the .yml extension.
name: modern-light
# Human-readable name shown in the radio's Theme picker.
label: Modern Light
# Default panel accent when a panel does not select a semantic accent itself.
accent: cyan
# Skip automatic contrast correction of palette color tokens.
correctForContrast: false
# Use light-palette defaults for alert tint separation when not set below.
light: true
# Minimum contrast ratio between alert backgrounds and neighboring surfaces.
tintSeparation: 1.08
colors:
  # Widget background behind all panels.
  canvas: 0xE5EAF0
  # Default panel background.
  surface: 0xFFFFFF
  # Raised panel details and elevated controls.
  surfaceRaised: 0xE5EAF0
  # Panel outlines and borders.
  border: 0xB7C3D0
  # Unfilled tracks behind bars and other meters.
  track: 0xCED7E2
  # Primary readings and prominent text.
  text: 0x17212B
  # Secondary labels and supporting text.
  textMuted: 0x263642
  # Tertiary or low-priority text.
  textFaint: 0x3A4B58
  # Cyan semantic accent.
  cyan: 0x167BA8
  # Blue accent used for active-flight indication.
  blue: 0x2354C8
  # Green semantic accent.
  green: 0x147642
  # Amber semantic accent, including warning indication.
  amber: 0xBC7800
  # Orange semantic accent.
  orange: 0xC65B12
  # Critical-state foreground accent.
  critical: 0xC92D2D
  # Warning-state panel background; otherwise derived from amber.
  warningBg: 0xFFF3D8
  # Critical-state panel background; otherwise derived from critical.
  criticalBg: 0xFAD0D0
  # Active-flight panel background; otherwise derived from blue.
  activeBg: 0xD0DEF5
spacing:
  # Reserved spacing value; not currently used by the renderer.
  outerMargin: 4
  # Gap between samples in the Theme showcase.
  gutter: 4
  # Standard left inset for panel content.
  padding: 8
  # Left inset for short panels (less than 80 px high).
  paddingTight: 8
  # Right inset for panel content.
  paddingRight: 4
  # Vertical inset for compact content placement.
  paddingCompact: 6
  # Corner radius for rounded panels and shapes.
  radius: 8
  # Width of the panel's semantic accent stripe.
  accentWidth: 4
  # Reserved accent spacing value; not currently used by the renderer.
  accentGap: 4
  # Height of meter bars.
  barHeight: 4
  # Width of the outline shown around the selected panel.
  borderFocus: 2
