# Text review, screen 3 on AEROGRID PANEL2.
version: 1
grid:
  columns: 4
  rows: 4
panels:
  - id: three-readings
    type: text
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      texts:
        - label: MODE 2x2
          source: sf
          positions:
            up: DISARMED
            down: ARMED
        - label: RATE
          source: sa
          positions:
            up: LOW
            middle: MID
            down: HIGH
        - label: FLAP
          source: sb
          positions:
            up: UP
            middle: MID
            down: DOWN
  - id: tall
    type: text
    col: 2
    row: 0
    colSpan: 1
    rowSpan: 2
    config:
      accent: green
      texts:
        - label: RATE 1x2
          source: sa
          positions:
            up: LOW
            middle: MID
            down: HIGH
  - id: compact
    type: text
    col: 3
    row: 0
    colSpan: 1
    rowSpan: 1
    config:
      texts:
        - label: MODE 1x1
          source: sf
          positions:
            up: DISARMED
            down: ARMED
  - id: unmapped
    type: text
    col: 3
    row: 1
    colSpan: 1
    rowSpan: 1
    config:
      accent: amber
      texts:
        - label: NO MIDDLE
          source: sa
          positions:
            up: LOW
            down: HIGH
  - id: wide
    type: text
    col: 0
    row: 2
    colSpan: 2
    rowSpan: 1
    config:
      texts:
        - label: MODE 2x1
          source: sf
          positions:
            up: DISARMED
            down: ARMED
        - label: RATE
          source: sa
          positions:
            up: LOW
            middle: MID
            down: HIGH
  - id: three-wide
    type: text
    col: 0
    row: 3
    colSpan: 4
    rowSpan: 1
    config:
      accent: green
      texts:
        - label: MODE 4x1
          source: sf
          positions:
            up: DISARMED
            down: ARMED
        - label: RATE
          source: sa
          positions:
            up: LOW
            middle: MID
            down: HIGH
        - label: FLAP
          source: sb
          positions:
            up: UP
            middle: MID
            down: DOWN
