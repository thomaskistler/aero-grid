# Review harness for `model-identity`. Not a dashboard.
#
# One review screen exists at a time and its Dashboard ID names the component
# under review; this replaces whatever preceded it as the screen's target
# rather than adding an eleventh screen, because `MAX_CUSTOM_SCREENS` is 10
# and the fixture already carries ten. Earlier review layouts stay in the
# repository and keep being loaded by the shipped-layout test.
#
# **Read this screen against the model name you have set.** Every panel draws
# the same model and the same picture, because there is only one model
# loaded. The review is of what this component does with *your* name and
# *your* picture, so set the name to something fifteen characters long --
# `QUADCOPTER RACE` is a real one -- and then to `Hawk`, and compare.
#
# **The rule this screen exists to show.** Where there is a picture, the
# picture is the body and the model name moves up into the heading. Where
# there is not, the name is the reading in the body and the heading is
# whatever the layout called the panel. So the same name is drawn two
# different ways depending on whether a picture is there, and the panels are
# arranged in pairs to make that comparable rather than remembered.
#
# **Panels showing a picture set no label**, and cannot: the name takes the
# heading, so a label would have nowhere to go and the layout validator says
# so. Their headings below are model names, not captions.
#
# **The middle pair is the defect that is left.** Both are `2 x 2` with no
# picture, side by side, identical apart from their accent. With a
# fifteen-character name the reading is 279 px wide in a 226 px content box
# and is centred, so it hangs 26 px past one edge and 27 px past the other --
# into the panel beside it, which is why there is a panel beside it. This is
# the one finding the new arrangement does not answer: it only bites where no
# picture is drawn, because that is the only case where the name is still
# fitted against imagined widths rather than placed in a heading.
#
# **They are not in the top-left corner, and that is deliberate.** App mode
# reserves a corner for the menu button and the top-left panel gives up
# content width for it. That is correct behaviour, but it makes an identical
# pair stop being identical, which would sabotage the one comparison this
# screen exists to make. The corner holds a single panel instead, where the
# squeeze is visible and costs nothing.
#
# **The picture is contained, never cropped.** `fill = false` reaches EdgeTX
# as `StaticImage`'s `fillFrame`, where `setZoom` takes `min(zw, zh)` rather
# than `max`: the whole picture is scaled to fit inside the frame and the
# panel shows through at the ends. The frames here are much wider than a
# 192 x 114 model image, so the letterbox is at the sides on every span on
# this screen.
#
# **The `2 x 2` panel is the one to judge the arrangement by.** Its frame is
# 226 x 77 and the aircraft is drawn at 129 x 77, which is the largest this
# screen gets. Every other picture here is one row tall: 28 px of height
# whatever the width, so a 46 x 28 aircraft with the rest letterbox. The
# strip is worth seeing because it is what a single row gives you, but it is
# not the arrangement the user chose -- until now this screen had only
# strips, and the decision had never been looked at properly.
#
# **What this screen cannot show.** The bitmap comes from the loaded model,
# not from a panel, so every panel here draws the same file and none of them
# can be pointed at a different one. Seeing the fallback means changing the
# model's own bitmap, which changes every panel at once: name a file that is
# not on the card and every panel falls back to the model name with its
# configured heading restored, which is the case the check handles. Name a
# file that is on the card and is not a decodable picture and every panel
# goes blank, because `fstat` cannot tell the two apart. That second one is
# worth doing once by hand.
version: 1
grid:
  columns: 4
  rows: 4
components:
  # The corner. A single cell is the narrowest heading this component can be
  # asked to draw a model name into, so it is where the heading's own
  # abbreviation shows: a fifteen-character name is cut and what was dropped
  # is reported to the host. Alone in the corner, so the menu button's
  # reserved width spoils no comparison.
  - id: corner
    type: model-identity
    col: 0
    row: 0
    colSpan: 1
    rowSpan: 1
    config:
      presentation: image

  # The same span with no picture, so the name is the reading instead. Beside
  # the panel above, the two treatments of one string can be read together.
  - id: corner-name
    type: model-identity
    col: 1
    row: 0
    colSpan: 1
    rowSpan: 1
    config:
      label: NAME 1x1
      presentation: name

  # **The panel this screen was missing.** Two cells square: the frame is
  # 226 x 77 and the aircraft is drawn at 129 x 77, letterboxed at the sides.
  # The largest picture here and the one the arrangement should be judged on.
  - id: picture-2x2
    type: model-identity
    col: 2
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      accent: green
      presentation: image

  # A wide single row, for contrast with the panel beside it. The frame is
  # 226 x 28 and the picture 46 x 28, so most of this panel is letterbox: the
  # height binds and a short wide frame cannot use its width.
  - id: wide-strip
    type: model-identity
    col: 0
    row: 1
    colSpan: 2
    rowSpan: 1
    config:
      presentation: image

  # The pair. Identical but for the accent, no picture, at the span where a
  # long name overhangs furthest. Kept at two cells square because that is
  # where the overhang is worst and it is still an open defect.
  - id: overhang-left
    type: model-identity
    col: 0
    row: 2
    colSpan: 2
    rowSpan: 2
    config:
      label: NAME L
      presentation: name

  - id: overhang-right
    type: model-identity
    col: 2
    row: 2
    colSpan: 2
    rowSpan: 2
    config:
      label: NAME R
      accent: amber
      presentation: name
