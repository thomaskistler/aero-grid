version: 1
grid:
  columns: 4
  rows: 4
components:
  - id: flight-clock
    type: flight-timer
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 1
    config:
      timer: 0
      label: Flight timer
  - id: transmitter-battery
    type: tx-battery
    col: 3
    row: 0
    colSpan: 1
    rowSpan: 1
    config:
      label: TX battery
  - id: identity
    type: model-identity
    col: 2
    row: 2
    colSpan: 2
    rowSpan: 2
    config:
      presentation: image
