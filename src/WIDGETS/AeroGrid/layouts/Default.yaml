version: 3
grid:
  columns: 4
  rows: 4
panels:
  - id: receiver-battery
    type: rx-battery
    col: 0
    row: 1
    colSpan: 2
    rowSpan: 1
    config:
      label: RX battery
      source: RxBt
      cells: 2
      reading: cell
      visual: none
      showCount: true
      showPack: true
  - id: link
    type: link-status
    col: 0
    row: 3
    colSpan: 2
    rowSpan: 1
    config:
      label: Link
      reading: quality
      qualitySource: RQly
      rssiSource: 1RSS
      protocol: elrs4
      modeSource: RFMD
      visual: none
  - id: transmitter-battery
    type: tx-battery
    col: 0
    row: 0
    colSpan: 1
    rowSpan: 1
    config:
      label: TX
      visual: none
  - id: flight-clock
    type: flight-timer
    col: 0
    row: 2
    colSpan: 2
    rowSpan: 1
    config:
      timer: 0
      label: Flight timer
  - id: flight-count
    type: flight-counter
    col: 1
    row: 0
    colSpan: 1
    rowSpan: 1
    config:
      label: Flights
      armSwitch: SFv
      motorSource: ch3
  - id: identity
    type: model-identity
    col: 2
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      presentation: image
  - id: outputs
    type: output
    col: 2
    row: 2
    colSpan: 2
    rowSpan: 2
