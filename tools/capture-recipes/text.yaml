version: 1
panel: text
theme: modern-dark
border:
  pixels: 10
  rgb: [0, 0, 0]
panels:
  1x2: {col: 1, row: 0, colSpan: 1, rowSpan: 2}
  2x1: {col: 2, row: 0, colSpan: 2, rowSpan: 1}
  2x2: {col: 2, row: 2, colSpan: 2, rowSpan: 2}
config:
  accent: cyan
  texts:
    - label: MODE
      source: sf
      positions:
        up: DISARMED
        down: ARMED
    - label: RATE
      source: sa
      positions:
        up: LOW
        middle: MID
        down: HIGH
    - label: FLAP
      source: sb
      positions:
        up: UP
        middle: MID
        down: DOWN
sample:
  switches:
    sf: down
    sa: down
    sb: middle
