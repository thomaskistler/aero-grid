site_name: AeroGrid
site_description: Configurable glass-cockpit dashboards for EdgeTX color radios.
site_url: https://thomaskistler.github.io/aero-grid/
repo_url: https://github.com/thomaskistler/aero-grid
edit_uri: edit/main/docs/
copyright: Copyright &copy; AeroGrid contributors. GPL-2.0-only.

theme:
  name: mkdocs
  custom_dir: docs/overrides
  color_mode: light
  nav_style: light

extra_css:
  - stylesheets/aerogrid.css

nav:
  - Home: index.md
  - User Guide:
      - Install and upgrade: user-guide/installation.md
      - Add, configure and edit a dashboard: user-guide/dashboards.md
  - Reference Guide:
      - Overview: reference-guide/index.md
      - Panels:
          - Metric: panels/metric.md
          - Text: panels/text.md
          - Flight timer: panels/flight-timer.md
          - Flight counter: panels/flight-counter.md
          - Flight mode: panels/flight-mode.md
          - TX battery: panels/tx-battery.md
          - Cell battery: panels/cell-battery.md
          - Link status: panels/link-status.md
          - Trim panel: panels/trim-panel.md
          - Model identity: panels/model-identity.md
          - Navigation: panels/navigation.md
  - Developer Guide:
      - Check out and build: developer-guide/build.md
      - Test and debug: developer-guide/testing.md
      - Run and test in simulators: developer-guide/simulators.md
      - Repository and architecture: developer-guide/architecture.md
      - Project tools: developer-guide/tools.md
      - Issues, changes, and releases: developer-guide/contributing.md

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
