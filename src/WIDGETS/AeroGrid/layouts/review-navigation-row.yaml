# Review harness for the supporting row's arrangement. Not a dashboard.
#
# One review screen exists at a time and its Dashboard ID names what is under
# review; this replaces `review-tx-battery` as the screen's target rather than
# adding an eleventh, because `MAX_CUSTOM_SCREENS` is 10. The previous review
# layouts stay in the repository and keep being loaded by the shipped-layout
# test.
#
# **The question.** `navigation` draws two things on its supporting row -- a
# bearing and an origin caption -- and there are two ways to place them. The
# column split that ships gives the bearing 40% of the content and the caption
# the remaining 60%, each left-aligned in its own column, and between them they
# reach the whole panel. The slot rule says a row of two takes the panel's two
# slot centres, the same 30% and 70% the reading and the dial use.
#
# **What the slot rule costs, and why it cannot be settled by argument.** Two
# boxes centred 40% of the content apart can each be 40% wide before they meet.
# A column split reaches 100%. So slotting the row hands back the panel's outer
# fifth, and `fitLabel` spends the difference on a shorter wording:
#
#   LAST KNOWN        becomes  LAST
#   NO HOME POSITION  becomes  NO HOME
#   NO GPS SOURCE     becomes  NO GPS
#
# The third is not cosmetic. The specification puts the distinction between a
# sensor that is absent and one that is present without a fix in this row
# precisely because the row "has room for words and is fitted to its width",
# while the badge above it carries only the state. `NO GPS` is a missing sensor
# reading as a missing fix. So the arrangement that looks tidier is the one
# that says less, and which matters more is a judgement about what a pilot
# needs to read at a glance -- which is why this is a screen rather than a
# paragraph.
#
# **How to read it.** Each row of the grid is one comparison: the same panel,
# the same data, the same span, drawn both ways. The left panel of each pair is
# the column split as shipped; the right is the slotted alternative. The
# headings say which.
#
# **The top pair is the wording.** It names a GPS source no radio has, which is
# deterministic, so the two panels are guaranteed to read:
#
#   left, as shipped   NO GPS SOURCE
#   right, slotted     NO GPS
#
# That is the whole argument in one line. Both panels are describing a sensor
# that was never configured, and only one of them says so.
#
# **The bottom pair is the placement.** It reads the real GPS source, so both
# panels carry identical text and differ only in where it sits -- the bearing
# starts at the padding on the left and at 30% of the content on the right.
# Worth looking at on its own, because the wording cost above is a reason to
# reject the slotted row and this is the reason it was proposed.
#
# **`LAST KNOWN` needs telemetry to stop**, which no layout can arrange: it is
# the wording for a position that was known and has gone quiet. Stop the
# simulator's telemetry for a few seconds and the bottom pair becomes
# `LAST KNOWN` on the left and `LAST` on the right.
#
# Both pairs are `2 x 2`, which is the span where the row carries two items and
# a dial at the same time, and therefore where the arrangement is decided. At
# `2 x 1` the row is shed entirely and there is nothing to compare.
version: 1
grid:
  columns: 4
  rows: 4
components:
  - id: absent-columns
    type: navigation
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      label: COLUMNS
      # A name no radio has a sensor for, so `known` is false and the caption
      # is the one whose shortening loses a real distinction.
      source: NOSENSOR
      presentation: detailed
      rowLayout: columns
  - id: absent-slots
    type: navigation
    col: 2
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      label: SLOTS
      source: NOSENSOR
      presentation: detailed
      rowLayout: slots
  - id: live-columns
    type: navigation
    col: 0
    row: 2
    colSpan: 2
    rowSpan: 2
    config:
      label: COLUMNS
      source: GPS
      presentation: detailed
      rowLayout: columns
  - id: live-slots
    type: navigation
    col: 2
    row: 2
    colSpan: 2
    rowSpan: 2
    config:
      label: SLOTS
      source: GPS
      presentation: detailed
      rowLayout: slots
