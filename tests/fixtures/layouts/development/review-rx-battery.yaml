# RX battery review, screen 1 on AEROGRID PANEL1.
# RxBt must measure the flight pack, not a regulated receiver supply.
# The upper pair compares a pack headline drawn with the battery glyph, which
# never carries supporting details, against an estimated average-cell headline
# in alternate-reading mode (stored as `visual: none`). The lower panels show
# narrow and single-row shedding in bar and alternate-reading modes, and a
# cells-monitor source for comparison. Cels is absent on the ELRS fixture.
version: 2
grid:
  columns: 4
  rows: 4
panels:
  - id: pack
    type: rx-battery
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      source: RxBt
      label: PACK VOLTAGE
      reading: pack
      cells: 4

  - id: average
    type: rx-battery
    col: 2
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      source: RxBt
      label: AVERAGE CELL
      visual: none
      reading: cell
      cells: 0

  - id: narrow-pack
    type: rx-battery
    col: 0
    row: 2
    colSpan: 1
    rowSpan: 2
    config:
      source: RxBt
      label: PACK 1x2
      visual: bar
      reading: pack
      cells: 4

  - id: narrow-average
    type: rx-battery
    col: 1
    row: 2
    colSpan: 1
    rowSpan: 2
    config:
      source: RxBt
      label: AVG 1x2
      visual: none
      reading: cell
      cells: 4

  - id: smallest
    type: rx-battery
    col: 2
    row: 2
    colSpan: 1
    rowSpan: 1
    config:
      source: RxBt
      label: 1x1
      reading: cell
      cells: 4

  - id: monitor
    type: rx-battery
    col: 3
    row: 2
    colSpan: 1
    rowSpan: 2
    config:
      source: Cels
      showDelta: true
      label: MONITOR
      visual: bar
      reading: cell

  - id: smallest-pack
    type: rx-battery
    col: 2
    row: 3
    colSpan: 1
    rowSpan: 1
    config:
      source: RxBt
      label: PACK 1x1
      reading: pack
      cells: 4
