# Review harness for `tx-battery`. Not a dashboard.
#
# One review screen exists at a time and its Dashboard ID names the component
# under review; this replaces `review-flight-mode` as the screen's target
# rather than adding a tenth screen, because `MAX_CUSTOM_SCREENS` is 10 and
# the fixture already carries ten. The previous review layout stays in the
# repository and keeps being loaded by the shipped-layout test.
#
# This pass is about the battery glyph replacing the bar, so the arrangement
# below is chosen to show the three things that are hard to imagine from a
# description and impossible to judge from a diff.
#
# **The fill carries the state.** Two panels of the same span sit side by
# side, one healthy and one critical, so a red fill can be compared against a
# cyan one rather than remembered. The fixture transmitter reads 7.9 V, so the
# thresholds are rigged either side of it and each panel stays in its state
# rather than flickering through it.
#
# **The glyph costs the reading width, and only in one place.** A `2 x 2`
# keeps XXLSIZE and drops the `V`; a `1 x 2` steps from DBLSIZE to MIDSIZE,
# because 105 pixels of content cannot hold a DBLSIZE reading and a battery
# side by side. Both are here, adjacent, which is the only way to see whether
# that trade is acceptable.
#
# **The bar is still there if you want it.** The bottom row holds a bar
# against a glyph at the same span, which is the comparison that decides
# whether keeping both was right.
version: 1
grid:
  columns: 4
  rows: 4
components:
  # The arrangement the mock asks for: reading hard left, battery right,
  # percentage beneath the battery. This is the span where it works fully.
  - id: full
    type: tx-battery
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      label: 2x2
      packEmpty: 6.6
      packFull: 8.4
      showPercent: true

  # The same panel in the state worth looking at. 7.9 V is at or below 8.0,
  # so it stays critical: red fill, tinted surface, CRIT badge.
  - id: alarmed
    type: tx-battery
    col: 2
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      label: 2x2 CRIT
      packEmpty: 6.6
      packFull: 8.4
      warning: 8.2
      critical: 8.0
      showPercent: true

  # One cell wide and two tall. The percentage cannot fit under a 32 pixel
  # battery, so it stays under the reading, and the reading steps down one
  # size to make room. This is the span where the arrangement bends.
  - id: narrow
    type: tx-battery
    col: 0
    row: 2
    colSpan: 1
    rowSpan: 2
    config:
      label: 1x2
      packEmpty: 6.6
      packFull: 8.4
      showPercent: true

  # A single cell, which sheds the visual entirely: 105 pixels of content is
  # the reading and nothing else.
  - id: smallest
    type: tx-battery
    col: 1
    row: 2
    colSpan: 1
    rowSpan: 1
    config:
      label: 1x1
      packEmpty: 6.6
      packFull: 8.4

  # A single row, where there is no percentage at any width. The battery is
  # centred on the reading rather than sitting above a row that is not there.
  - id: wide
    type: tx-battery
    col: 2
    row: 2
    colSpan: 2
    rowSpan: 1
    config:
      label: 2x1 GLYPH
      packEmpty: 6.6
      packFull: 8.4

  # Warning rather than critical, so the two alarm tints can be told apart.
  - id: warned
    type: tx-battery
    col: 1
    row: 3
    colSpan: 1
    rowSpan: 1
    config:
      label: WARN
      packEmpty: 6.6
      packFull: 8.4
      warning: 8.0

  # The bar, at the same span as the glyph above it, for comparison.
  - id: barred
    type: tx-battery
    col: 2
    row: 3
    colSpan: 2
    rowSpan: 1
    config:
      label: 2x1 BAR
      accent: amber
      packEmpty: 6.6
      packFull: 8.4
      visual: bar
