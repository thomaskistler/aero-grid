version: 1

# Theme mode may be modern, edgetx, or custom. When present this overrides the
# native Theme widget option. Custom mode accepts canvas, surface, text, and
# accent overrides only.
theme:
  mode: modern

grid:
  columns: 4
  rows: 4

components:
  - id: pack
    type: metric
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      label: Pack
      source: RxBt
      unit: V
      accent: cyan
      min: 18
      max: 25.2
      warning: 21.0
      critical: 19.8
      precision: 1
      visual: bar
  - id: current
    type: metric
    col: 2
    row: 0
    colSpan: 2
    rowSpan: 1
    config:
      label: Current
      source: Curr
      accent: orange
      min: 0
      max: 120
      warning: 90
      critical: 110
      visual: bar
  - id: altitude
    type: metric
    col: 2
    row: 1
    colSpan: 2
    rowSpan: 1
    config:
      label: Altitude
      source: Alt
      accent: green
      min: 0
      max: 400
      warning: 250
      critical: 350
      visual: radial
  - id: pulse
    type: heartbeat
    col: 0
    row: 2
    colSpan: 2
    rowSpan: 2
    config:
      label: HEARTBEAT
      accent: amber
  - id: secondary
    type: placeholder
    col: 2
    row: 2
    colSpan: 2
    rowSpan: 2
    config:
      title: PHASE 1
      subtitle: DESIGN SYSTEM
      accent: green
