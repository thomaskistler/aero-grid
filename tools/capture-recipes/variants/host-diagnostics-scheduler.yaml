version: 1
panel: host-diagnostics
theme: modern-dark
brighten_supporting_text: true
border:
  pixels: 10
  rgb: [0, 0, 0]
panels:
  2x2: {col: 2, row: 2, colSpan: 2, rowSpan: 2}
config:
  section: scheduler
  accent: cyan
sample: {}
# Uncropped panels whose refresh work the scheduler view measures.
companions:
  - {type: flight-timer, col: 0, row: 0, colSpan: 2, rowSpan: 1, config: {label: Timer}}
  - {type: tx-battery, col: 2, row: 0, colSpan: 1, rowSpan: 1, config: {label: TX}}
  - {type: model-identity, col: 3, row: 0, colSpan: 1, rowSpan: 1, config: {label: Model}}
  - {type: output, col: 0, row: 1, colSpan: 2, rowSpan: 1, config: {label: Outputs}}
  - {type: trim-panel, col: 2, row: 1, colSpan: 2, rowSpan: 1, config: {label: Trims}}
  - {type: flight-mode, col: 0, row: 2, colSpan: 2, rowSpan: 1, config: {label: Mode}}
