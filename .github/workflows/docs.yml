name: Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - tools/installer_assets.py
      - tools/test_installer_assets.py
      - requirements-docs-test.txt
      - tools/test_docs_layout.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - tools/installer_assets.py
      - tools/test_installer_assets.py
      - requirements-docs-test.txt
      - tools/test_docs_layout.py
      - .github/workflows/docs.yml
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-docs-test.txt
      - name: Install documentation dependencies
        run: |
          python -m pip install -r requirements-docs-test.txt
          python -m playwright install --with-deps chromium
      - name: Build and validate
        run: python -m mkdocs build --strict --site-dir build/docs
      - name: Publish validated browser installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tools -p 'test_installer_*.py'
          python tools/installer_assets.py --output build/docs/installer
      - name: Check responsive documentation tables
        run: python -m unittest discover -s tools -p 'test_docs_layout.py'
      - name: Upload Pages artifact
        if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  deploy:
    name: Publish documentation
    if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
