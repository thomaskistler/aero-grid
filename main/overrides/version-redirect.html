<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url={{ href }}">
    <title>Redirecting to AeroGrid documentation</title>
  </head>
  <body>
    <p><a href="{{ href }}">Continue to the documentation</a></p>
    <script>
      const target = new URL({{ href|tojson }}, location.href);
      new URLSearchParams(location.search).forEach((value, key) => target.searchParams.set(key, value));
      target.hash = location.hash;
      location.replace(target.href);
    </script>
  </body>
</html>
