# Trim-panel review, screen 7 on AEROGRID REVIEW.
# Move the radio's trim controls to compare the three-axis square and readouts.
version: 1
grid:
  columns: 4
  rows: 4
panels:
  - id: axes
    type: trim-panel
    col: 0
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      label: TRIMS

  - id: raw-square
    type: trim-panel
    col: 2
    row: 0
    colSpan: 2
    rowSpan: 2
    config:
      label: RAW
      readout: raw

  - id: tall
    type: trim-panel
    col: 0
    row: 2
    colSpan: 1
    rowSpan: 2
    config:
      label: TALL

  - id: raw
    type: trim-panel
    col: 1
    row: 2
    colSpan: 1
    rowSpan: 2
    config:
      label: RAW
      readout: raw

  - id: compact
    type: trim-panel
    col: 2
    row: 2
    colSpan: 1
    rowSpan: 1
    config:
      label: 1x1

  - id: no-readout
    type: trim-panel
    col: 3
    row: 2
    colSpan: 1
    rowSpan: 1
    config:
      label: BAR
      readout: none

  - id: wide
    type: trim-panel
    col: 2
    row: 3
    colSpan: 2
    rowSpan: 1
    config:
      label: WIDE
      readout: raw
