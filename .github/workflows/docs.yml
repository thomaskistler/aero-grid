name: Documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - tools/installer_assets.py
      - tools/test_installer_assets.py
      - requirements-docs-test.txt
      - tools/test_docs_layout.py
      - tools/docs_version_hook.py
      - tools/docs_versions.py
      - tools/test_docs_versions.py
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - tools/installer_assets.py
      - tools/test_installer_assets.py
      - requirements-docs-test.txt
      - tools/test_docs_layout.py
      - tools/docs_version_hook.py
      - tools/docs_versions.py
      - tools/test_docs_versions.py
      - .github/workflows/docs.yml
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && 'main' || github.ref }}
          fetch-depth: 0
      - name: Record publishing source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-docs-test.txt
      - name: Install documentation dependencies
        run: |
          python -m pip install -r requirements-docs-test.txt
          python -m playwright install --with-deps chromium
      - name: Build and validate
        run: python -m mkdocs build --strict --site-dir build/docs
      - name: Check documentation tooling and layout
        run: |
          python -m unittest discover -s tools -p 'test_installer_*.py'
          python -m unittest discover -s tools -p 'test_docs_*.py'

  assemble:
    name: Assemble all documentation versions
    if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Restore documentation snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git branch gh-pages origin/gh-pages
          fi
      - name: Build missing releases and update main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/docs_versions.py --output build/pages
      - name: Publish validated browser installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/installer_assets.py --output build/pages/installer
      - name: Save documentation snapshots
        run: git push origin gh-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    name: Publish documentation
    if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
