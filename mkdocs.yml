site_name: AeroGrid
site_description: Configurable glass-cockpit dashboards for EdgeTX color radios.
site_url: https://thomaskistler.github.io/aero-grid/
repo_url: https://github.com/thomaskistler/aero-grid
edit_uri: edit/main/docs/
copyright: Copyright &copy; AeroGrid contributors. GPL-2.0-only.

theme:
  name: mkdocs
  custom_dir: docs/overrides
  color_mode: light
  nav_style: light
  analytics:
    gtag: G-RMCKML1PKS

extra_css:
  - stylesheets/aerogrid.css

extra_javascript:
  - path: javascripts/radio-connection-help.mjs
    type: module
  - javascripts/map-pack.js
  - javascripts/map-sources.js
  - javascripts/map-planner.js
  - path: javascripts/radio-panel.mjs
    type: module
  - path: javascripts/radio-map-manager.mjs
    type: module

nav:
  - Home: index.md
  - User Guide:
      - Install and upgrade: user-guide/installation.md
      - Add a dashboard: user-guide/add-dashboard.md
      - Edit model settings: user-guide/model-settings.md
      - Edit a dashboard on the radio: user-guide/edit-dashboard.md
      - Customize themes: user-guide/customize-themes.md
      - Map Manager: map-manager.md
      - Troubleshoot and file bugs: user-guide/troubleshooting.md
  - Reference Guide:
      - Overview: reference-guide/index.md
      - Panels:
          - Channel output: panels/output.md
          - Chart: panels/chart.md
          - Flight counter: panels/flight-counter.md
          - Flight mode: panels/flight-mode.md
          - Flight timer: panels/flight-timer.md
          - Host diagnostics: panels/host-diagnostics.md
          - Link status: panels/link-status.md
          - Metric: panels/metric.md
          - Model identity: panels/model-identity.md
          - Navigation: panels/navigation.md
          - RX battery: panels/rx-battery.md
          - Service probe: panels/service-probe.md
          - State: panels/state.md
          - Trim: panels/trim-panel.md
          - TX battery: panels/tx-battery.md
      - YAML reference: reference-guide/yaml.md
  - Developer Guide:
      - Check out and build: developer-guide/build.md
      - Test and debug: developer-guide/testing.md
      - Run and test in simulators: developer-guide/simulators.md
      - Map areas and shared tiles: developer-guide/map-packs.md
      - Radio map rendering prototype: developer-guide/map-prototype.md
      - Repository and architecture: developer-guide/architecture.md
      - Project tools: developer-guide/tools.md
      - Tutorial videos: developer-guide/videos.md
      - Issues, changes, and releases: developer-guide/contributing.md

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
